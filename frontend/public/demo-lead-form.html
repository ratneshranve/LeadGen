<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Us — Demo Website Form</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; background: #fbf9f4; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; border: 1px solid #ece7dc; border-radius: 16px; padding: 32px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
  h1 { font-size: 1.3rem; margin: 0 0 4px; color: #141416; }
  p.sub { font-size: 0.85rem; color: #64748b; margin: 0 0 20px; }
  label { display: block; font-size: 0.8rem; font-weight: 700; color: #334155; margin: 14px 0 6px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; }
  button { margin-top: 20px; width: 100%; padding: 12px; border: none; border-radius: 8px; background: #ff3b19; color: #fff; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; display: none; }
  .msg.ok { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  .msg.err { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
</style>
</head>
<body>
  <div class="card">
    <h1>Request a Demo</h1>
    <p class="sub">This simulates a real company website's contact form, hitting LeadGen's public ingestion endpoint — no login required.</p>
    <form id="leadForm">
      <label>Full Name *</label>
      <input name="name" required placeholder="Jordan Smith" />
      <label>Phone *</label>
      <input name="phone" required placeholder="+1 555 123 4567" />
      <label>Email</label>
      <input name="email" type="email" placeholder="jordan@company.com" />
      <label>Company</label>
      <input name="company" placeholder="Acme Corp" />
      <label>Message</label>
      <textarea name="message" rows="3" placeholder="We'd like a demo for our 50-person sales team..."></textarea>
      <button type="submit" id="submitBtn">Submit</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>

  <script>
    const API_BASE = "http://localhost:5000/api/v1";
    const form = document.getElementById("leadForm");
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = "Submitting...";
      msg.style.display = "none";

      const data = Object.fromEntries(new FormData(form).entries());
      try {
        const res = await fetch(`${API_BASE}/ingest/public`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.message || "Submission failed");

        msg.className = "msg ok";
        msg.textContent = json.data.duplicate
          ? `Thanks! We already have your details on file (matched existing lead ${json.data.lead.customLeadId}).`
          : `Thanks! Your enquiry was received (lead ${json.data.lead.customLeadId}). A team member will reach out shortly.`;
        msg.style.display = "block";
        form.reset();
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = err.message;
        msg.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Submit";
      }
    });
  </script>
</body>
</html>
